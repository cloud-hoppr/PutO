<script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    function startTask() {
        const taskText = document.getElementById('task-input').value.trim();
        if(!taskText) return alert("Введите задачу!");

        tg.sendData(JSON.stringify({ action: "split_task", task: taskText }));
    }

    function completeStep() {
        tg.sendData(JSON.stringify({ action: "complete_step" }));
    }
</script>
